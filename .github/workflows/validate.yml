name: Foundation validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify runtime and catalog
        run: |
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 12)'
          python3 -m tools.validate_catalog
          python3 -m tools.validate_discovery
      - name: Run deterministic contract tests
        run: python3 -m unittest discover -s tests -v
      - name: Check whitespace and prior catalog when available
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --check
          git diff-tree --check --root -r -m HEAD
          if [ -n "$PR_BASE_SHA" ]; then
            git cat-file -e "$PR_BASE_SHA^{commit}"
            git diff --check "$PR_BASE_SHA" HEAD
            if git cat-file -e "$PR_BASE_SHA:research/catalog.json" 2>/dev/null; then
              base_catalog=$(mktemp)
              trap 'rm -f "$base_catalog"' EXIT
              git show "$PR_BASE_SHA:research/catalog.json" > "$base_catalog"
              python3 -m tools.validate_catalog --base "$base_catalog"
            else
              echo 'Initial foundation: PR base has no catalog; history comparison NOT RUN.'
            fi
          fi
